[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surmap"
version = "0.1.0"
description = "Passive drone survey: stereo + RTAB-Map static map + on-board object detection/tracking, fused into a GPS-anchored semantic map"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ai-edge-litert>=2.3.0",
    "connectrpc==0.12.1",
    "googleapis-common-protos>=1.70",
    "hypercorn>=0.17",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "protobuf>=6.33,<7",
    # connectrpc 0.12.1 imports protobuf.wkt.api_pb, removed after
    # protobuf-py 0.5.0; see docs/connectrpc.md before bumping.
    "protobuf-py==0.5.0",
    "websockets>=14.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-protobuf>=7.35.1.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/surmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# Generated protobuf bindings are produced by scripts/gen_socket_rpc.py.
extend-exclude = ["src/surmap/transport/v1/socket_rpc_pb2.py", "src/surmap/transport/v1/socket_rpc_pb2.pyi", "src/surmap/survey/v1/survey_pb2.py", "src/surmap/survey/v1/survey_pb2.pyi"]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Generated by scripts/gen_socket_rpc.py; do not edit or lint by hand.
"src/surmap/transport/v1/socket_rpc_pb2.py" = ["ALL"]
"src/surmap/transport/v1/socket_rpc_pb2.pyi" = ["ALL"]
# Generated by scripts/gen_survey_rpc.py; do not edit or lint by hand.
"src/surmap/survey/v1/survey_pb2.py" = ["ALL"]
"src/surmap/survey/v1/survey_pb2.pyi" = ["ALL"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# googleapis-common-protos ships no stubs or py.typed marker.
module = "google.api.*"
ignore_missing_imports = true

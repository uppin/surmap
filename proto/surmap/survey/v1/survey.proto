syntax = "proto3";

package surmap.survey.v1;

/*
Survey streaming: the wire contract for the CM5 (on-board) and the base
station, from docs/architecture.md section 10.

Both services are bidirectional streams with the same input shape: the
client opens with a config message (calibration, plus what it wants),
then sends raw video frames, one per channel per frame_id. The stereo
rig has two fixed channels: 0 (left) and 1 (right).

Outputs are told apart by an int32 designation, not by message type
alone:

    0        unspecified
    1        RTAB-Map static-scene points
    2        video channel 0 (left)
    3        video channel 1 (right)
    >= 100   one tracked object: 100 + track_id

The CM5 streams points incrementally: a point is sent when it is spawned,
and a point that still exists at a position already sent (for the same
designation, in the same stream) is never resent.
*/

// How a raw frame's bytes are encoded.
enum FrameEncoding {
  FRAME_ENCODING_UNSPECIFIED = 0;
  FRAME_ENCODING_MJPEG = 1;
  FRAME_ENCODING_RAW_RGB = 2;
}

// How the station treats frames it cannot keep up with.
enum AnalysisMode {
  ANALYSIS_MODE_UNSPECIFIED = 0;
  // Analyze every frame; the stream lags behind the sender if needed.
  ANALYSIS_MODE_EVERY_FRAME = 1;
  // Analyze only when the detector is free; frames in between are dropped.
  ANALYSIS_MODE_BEST_EFFORT_DROP = 2;
}

// A point in the map frame.
message Point3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

// A point in image pixel coordinates.
message Point2 {
  double x = 1;
  double y = 2;
}

// An axis-aligned box in image pixel coordinates.
message Box {
  double x_min = 1;
  double y_min = 2;
  double x_max = 3;
  double y_max = 4;
}

// Stereo calibration for the rig that produced the frames.
message StereoCalibration {
  // Which calibration produced the session (docs/architecture.md section 7).
  string calibration_id = 1;
  double focal_length_px = 2;
  // Distance between the two lenses, in metres.
  double baseline_m = 3;
  // Principal point, in pixels.
  double cx = 4;
  double cy = 5;
  uint32 width = 6;
  uint32 height = 7;
}

// One raw video frame on one channel, as sent by the frame source.
message RawVideoFrame {
  // Assigned by the sender; responses that belong to this frame repeat it.
  int64 frame_id = 1;
  // Monotonic-clock timestamp on the sending machine, nanoseconds.
  int64 t_ns = 2;
  // 0 (left) or 1 (right); the rig has exactly two fixed channels.
  int32 channel = 3;
  uint32 width = 4;
  uint32 height = 5;
  FrameEncoding encoding = 6;
  bytes data = 7;
}

// First CM5 client message: calibration, plus the video channels to echo back.
message Cm5StreamConfig {
  StereoCalibration calibration = 1;
  // Channels (0 and/or 1) whose frames the requester also wants streamed.
  repeated int32 video_channels = 2;
  // The stream's own camera definitions (EuRoC sensor.yaml text), so
  // the server can build a SLAM backend calibrated for this stream's
  // dataset instead of reusing one built for another. Empty when the
  // requester has none: the server's configured backend is used.
  string cam0_yaml = 3;
  string cam1_yaml = 4;
  // Deepest keyframe points (m) the stream's SLAM backend keeps, so
  // outdoor streams are not cut to an indoor depth. 0 = server default.
  double max_depth_m = 5;
}

// One client message on the CM5 stream: config first, then frames.
message Cm5Request {
  oneof kind {
    Cm5StreamConfig config = 1;
    RawVideoFrame frame = 2;
  }
}

// Newly spawned points under one designation, from one frame.
message PointBatch {
  // 1 for RTAB-Map scene points, >= 100 for one tracked object.
  int32 designation = 1;
  int64 frame_id = 2;
  int64 t_ns = 3;
  repeated Point3 points = 4;
}

// A video frame echoed back because its channel was requested.
message VideoFrameOut {
  // 2 for channel 0, 3 for channel 1.
  int32 designation = 1;
  RawVideoFrame frame = 2;
}

// One feature RTAB-Map tracked on a frame: rectified pixel + depth (m).
message TrackedKeypoint {
  int32 word_id = 1;
  float u = 2;
  float v = 3;
  float depth = 4;
}

// The left camera's stereo rectification (OpenCV R1 + intrinsics).
message RectificationOut {
  repeated double rotation = 1 [packed = true];
  repeated double rectified = 2 [packed = true];
  repeated double raw = 3 [packed = true];
  repeated double distortion = 4 [packed = true];
}

// One frame's odometry from the SLAM backend: its pose (and the
// map-corrected pose after loop closures), the keypoints tracked on
// it, and — on the first odometry a backend sends — its stereo
// rectification, so a client can put the keypoints on the raw image.
message OdomUpdateOut {
  int64 frame_id = 1;
  int64 t_ns = 2;
  optional Point3 position = 3;
  repeated double orientation_xyzw = 4 [packed = true];
  optional Point3 map_position = 5;
  repeated double map_orientation_xyzw = 6 [packed = true];
  repeated TrackedKeypoint keypoints = 7;
  optional RectificationOut rectification = 8;
}

// One server message on the CM5 stream.
message Cm5Response {
  oneof kind {
    PointBatch points = 1;
    VideoFrameOut video = 2;
    OdomUpdateOut odom = 3;
  }
}

// One detected object in one frame, from the on-board detector.
message ObjectDetection {
  string label = 1;
  double score = 2;
  Box box = 3;
  // The persistent track this detection belongs to, when tracking ran.
  optional int64 track_id = 4;
}

// All detections for one analyzed frame, on the detections stream.
message FrameDetections {
  // The frame_id the requester assigned to the analyzed frame.
  int64 frame_id = 1;
  // The analyzed frame's timestamp, nanoseconds.
  int64 t_ns = 2;
  repeated ObjectDetection detections = 3;
}

// One server message on the CM5 detections stream.
message DetectionResponse {
  FrameDetections detections = 1;
}

enum MovingVerdict {
  MOVING_VERDICT_UNKNOWN = 0;
  MOVING_VERDICT_RIGID_MOVER = 1;
  MOVING_VERDICT_OSCILLATING = 2;
}

enum IdentitySource {
  IDENTITY_SOURCE_DETECTOR = 0;
  IDENTITY_SOURCE_AREA_ALLOCATED = 1;
}

// Live moving-area observation (design: moving-object-detection),
// published as soon as stage 2 computes it. Keypoints never appear
// here; flush-time snapshots are MovingObjectSnapshot.
message MovingArea {
  int64 frame_id = 1;
  int64 t_ns = 2;
  repeated Point2 polygon = 3;
  double depth_min_m = 4;
  double depth_max_m = 5;
  int32 dynamic_point_count = 6;
  int64 area_track_id = 7;
  MovingVerdict verdict = 8;
  int64 verdict_version = 9;
}

// Flush-time snapshot for a graduated track: map-frame keypoints
// for one buffered observation.
message MovingObjectSnapshot {
  int64 frame_id = 1;
  int64 t_ns = 2;
  int64 area_track_id = 3;
  int64 object_track_id = 4;
  IdentitySource identity_source = 5;
  MovingVerdict verdict = 6;
  repeated Point3 keypoints = 7;
  Point3 centroid = 8;
  Point3 velocity = 9;
}

// One server message on the CM5 moving-areas stream.
message MovingAreasResponse {
  oneof payload {
    MovingArea area = 1;
    MovingObjectSnapshot snapshot = 2;
  }
}

// First station client message: calibration, analysis mode, SAM prompts.
message StationStreamConfig {
  StereoCalibration calibration = 1;
  AnalysisMode analysis_mode = 2;
  // Optional concept prompts steering SAM (docs/architecture.md section 3.1).
  repeated string concept_prompts = 3;
}

// One client message on the station stream: config first, then frames.
message StationRequest {
  oneof kind {
    StationStreamConfig config = 1;
    RawVideoFrame frame = 2;
  }
}

// One SAM detection in one frame.
message SamDetection {
  string label = 1;
  double score = 2;
  Box box = 3;
  // The segment outline, in pixel coordinates.
  repeated Point2 mask_polygon = 4;
  // The on-board track this detection belongs to, when known.
  optional int64 track_id = 5;
}

// All SAM detections for one analyzed frame.
message SamFrameDetections {
  // The frame_id the requester assigned to the analyzed frame.
  int64 frame_id = 1;
  repeated SamDetection detections = 2;
  // The execution provider that produced these detections, e.g.
  // "CUDAExecutionProvider", "SAM 3.1 (PyTorch)", "InMemorySamDetector".
  string provider = 3;
  // The device that provider ran on: "cuda:<index>" for GPU execution,
  // "cpu" otherwise. Together with `provider`, this says whether SAM
  // ran on the GPU or the CPU for this frame.
  string device = 4;
}

// One server message on the station stream.
message StationResponse {
  SamFrameDetections detections = 1;
}

// How a region query was answered.
enum RegionStatus {
  REGION_STATUS_UNSPECIFIED = 0;
  REGION_STATUS_OK = 1;
  // The frame is not (or no longer) in the CM5's frame ring.
  REGION_STATUS_FRAME_EXPIRED = 2;
  // Tracking was lost on that frame, so it has no pose.
  REGION_STATUS_NO_POSE = 3;
  // Channel not 0/1, fewer than 3 vertices, or a zero image size.
  REGION_STATUS_INVALID_QUERY = 4;
}

// A region of interest on one channel of one frame, e.g. a SAM mask.
message RegionQuery {
  // Assigned by the requester; every response for it repeats it.
  int64 query_id = 1;
  // The frame_id the frame was sent with on StreamSurvey.
  int64 frame_id = 2;
  // 0 (left) or 1 (right): the image the polygon was drawn on.
  int32 channel = 3;
  // Size of that image, in pixels: the polygon's coordinate space.
  uint32 width = 4;
  uint32 height = 5;
  repeated Point2 polygon = 6;
}

// Dense stereo points inside one queried region, from that frame only.
// Large regions arrive in several messages; the last has final set.
message RegionPoints {
  int64 query_id = 1;
  int64 frame_id = 2;
  int32 channel = 3;
  RegionStatus status = 4;
  // Map frame; never accumulated across frames or queries.
  repeated Point3 points = 5;
  // True on the last message for this query_id.
  bool final = 6;
}

// What a server was built with, asked before any stream is opened.
// Each service fills the fields that describe it and leaves the rest
// at their defaults; clients (the demo page) render only the features
// a host reports.
message CapabilitiesRequest {}

message Capabilities {
  // "cm5" or "station".
  string service = 1;
  // CM5: an object detector serves StreamDetections.
  bool detections = 2;
  // CM5: tracked objects' points join the survey output (designation >= 100).
  bool object_points = 3;
  // CM5: StreamMovingAreas is enabled.
  bool moving_areas = 4;
  // CM5: StreamRegionPoints has a region source.
  bool region_points = 5;
  // Station: a real SAM detector serves StreamAnalysis (not in-memory).
  bool sam_analysis = 6;
  // The detector's execution provider, e.g. "Coral",
  // "CUDAExecutionProvider", "SAM 3.1 (PyTorch)".
  string provider = 7;
  // The device that provider runs on: "cuda:<index>", "edgetpu", "cpu".
  string device = 8;
  // CM5 SLAM backend kind: "streaming", "sidecar", or "inmemory".
  string slam = 9;
}

// On-board (CM5): frames and calibration in, designated points and
// requested video channels out.
service Cm5SurveyService {
  // What this CM5 was built with (detector, object points, SLAM kind).
  rpc GetCapabilities(CapabilitiesRequest) returns (Capabilities);
  rpc StreamSurvey(stream Cm5Request) returns (stream Cm5Response);
  // Detections on their own stream, deliberately not attached to
  // survey output frames: the detector runs on its own cadence (it
  // may analyze fewer frames than the survey stream outputs), and
  // each message joins to its frame by frame_id. Same input shape
  // as StreamSurvey; only channel-0 frames are analyzed.
  rpc StreamDetections(stream Cm5Request) returns (stream DetectionResponse);
  // Moving areas on their own stream: the area pipeline runs at its
  // own, slower cadence and may lag the other streams; every message
  // joins to its frame by frame_id. Same input shape as StreamSurvey.
  rpc StreamMovingAreas(stream Cm5Request) returns (stream MovingAreasResponse);
  // Dense 3D points under a region of interest (a SAM mask): each
  // query names a frame sent on StreamSurvey, the channel the polygon
  // was drawn on, and the polygon; each answer comes from that one
  // frame's stereo pair, in the map frame. Frames stay queryable for
  // a bounded time; an older one is answered FRAME_EXPIRED.
  rpc StreamRegionPoints(stream RegionQuery) returns (stream RegionPoints);
}

// Base station: the same frames in, SAM detections out.
service StationSamService {
  // What this station was built with (SAM detector, provider, device).
  rpc GetCapabilities(CapabilitiesRequest) returns (Capabilities);
  rpc StreamAnalysis(stream StationRequest) returns (stream StationResponse);
}

// The calibration target a CameraCalibrationService stream collects
// views of. Explicit by design: a stream must name its target, and
// only a checkerboard is supported today.
enum CalibrationTargetType {
  CALIBRATION_TARGET_UNSPECIFIED = 0;
  CALIBRATION_TARGET_CHECKERBOARD = 1;
}

// The camera model a calibration solves (RTAB-Map's three).
enum CalibrationLensModel {
  // Treated as CALIBRATION_LENS_PINHOLE_RADTAN.
  CALIBRATION_LENS_UNSPECIFIED = 0;
  // Plumb bob: k1, k2, p1, p2 (k3 held at 0). The only model the
  // EuRoC export and the streaming sidecar take today.
  CALIBRATION_LENS_PINHOLE_RADTAN = 1;
  // OpenCV rational: k1, k2, p1, p2, k3, k4, k5, k6.
  CALIBRATION_LENS_PINHOLE_RATIONAL = 2;
  // Equidistant fisheye (cv::fisheye): k1, k2, k3, k4.
  CALIBRATION_LENS_FISHEYE = 3;
}

// Which corner of the board a planned viewpoint turns away from the camera.
enum CalibrationTilt {
  CALIBRATION_TILT_UNSPECIFIED = 0;
  // Board facing the camera.
  CALIBRATION_TILT_NONE = 1;
  CALIBRATION_TILT_TOP_LEFT_AWAY = 2;
  CALIBRATION_TILT_TOP_RIGHT_AWAY = 3;
  CALIBRATION_TILT_BOTTOM_LEFT_AWAY = 4;
  CALIBRATION_TILT_BOTTOM_RIGHT_AWAY = 5;
}

// Outcome of one stereo view in a calibration stream.
enum CalibrationViewStatus {
  CALIBRATION_VIEW_UNSPECIFIED = 0;
  // Board found in both eyes and the view was kept.
  CALIBRATION_VIEW_ACCEPTED = 1;
  // Board not found in at least one eye.
  CALIBRATION_VIEW_BOARD_NOT_FOUND = 2;
  // Board found but too close in position/scale to a kept view.
  CALIBRATION_VIEW_TOO_SIMILAR = 3;
  // The frame bytes could not be decoded; the stream continues.
  CALIBRATION_VIEW_FRAME_UNREADABLE = 4;
}

// A checkerboard's inner-corner grid and square size.
message CheckerboardSpec {
  // Inner corners across (columns) and down (rows).
  uint32 cols = 1;
  uint32 rows = 2;
  double square_size_m = 3;
}

// First calibration client message: the target and how many views.
message CalibrationConfig {
  CalibrationTargetType target_type = 1;
  // Set when target_type is CALIBRATION_TARGET_CHECKERBOARD.
  CheckerboardSpec checkerboard = 2;
  // Diverse accepted views required before finish can solve.
  uint32 min_views = 3;
  // Frame size; 0 takes it from the first frame. Every frame must match.
  uint32 width = 4;
  uint32 height = 5;
  CalibrationLensModel lens_model = 6;
  // Also try detection on the frame upscaled up to this factor (1..3,
  // 0 = 1), for boards too small at native resolution (RTAB-Map's
  // "max scale").
  uint32 max_detection_scale = 7;
  // When > 0, the solved translation is scaled to this baseline
  // (metres) and the result reports the scale and implied square size.
  double expected_baseline_m = 8;
}

// One stereo pair for calibration: both eyes of one instant.
message CalibrationStereoFrame {
  RawVideoFrame left = 1;
  RawVideoFrame right = 2;
}

// One client message on the calibration stream: config, frames, finish.
message CalibrationRequest {
  oneof kind {
    CalibrationConfig config = 1;
    CalibrationStereoFrame frame = 2;
    // True asks the server to solve from the accepted views.
    bool finish = 3;
  }
}

// Where to move the camera (or board) for the next calibration view.
message MoveSuggestion {
  // Image cell the board centre should occupy next, e.g. "centre",
  // "upper_left": a 3x3 grid over the image plus "near"/"far" in the
  // instruction when a different distance is wanted.
  string target_cell = 1;
  // Move the camera by this vector (metres, camera frame: x right,
  // y down, z forward) to centre the board on the target cell at the
  // board's current distance. Zero when the board was not found.
  double move_x_m = 2;
  double move_y_m = 3;
  double move_z_m = 4;
  // Suggested board distance (m) for the next view; 0 = keep distance.
  double target_distance_m = 5;
  string instruction = 6;
  // The CalibrationPlan viewpoint this suggests, or -1.
  int32 viewpoint_index = 7;
}

// One view the calibration needs, in image terms (no intrinsics needed).
message CalibrationViewpoint {
  uint32 index = 1;
  // 3x3 image cell of the board centre, e.g. "centre", "upper_left".
  string target_cell = 2;
  // Board centre, normalized to [0,1] over the image.
  double center_x = 3;
  double center_y = 4;
  // RTAB-Map size: sqrt(board quad area / image area).
  double board_size = 5;
  CalibrationTilt tilt = 6;
  double tilt_deg = 7;
  // Board distance for board_size at a nominal focal of one image width.
  double distance_m = 8;
  string instruction = 9;
}

// Every viewpoint that, filled, clears RTAB-Map's readiness bar.
message CalibrationPlan {
  repeated CalibrationViewpoint viewpoints = 1;
}

// Per-view calibration feedback for one stereo pair.
message CalibrationFeedback {
  int64 frame_id = 1;
  CalibrationViewStatus status = 2;
  bool left_found = 3;
  bool right_found = 4;
  uint32 corners_left = 5;
  uint32 corners_right = 6;
  // Board centre, normalized to [0,1] over the left image (0 when lost).
  double board_center_x = 7;
  double board_center_y = 8;
  // Board bounding-box area as a fraction of the left image.
  double board_fraction = 9;
  uint32 accepted_views = 10;
  uint32 required_views = 11;
  // Fraction of the 3x3 position cells covered by accepted views.
  double coverage_fraction = 12;
  bool ready = 13;
  MoveSuggestion suggestion = 14;
  string message = 15;
  // This view in RTAB-Map's terms, each in [0,1]: size is
  // sqrt(board quad area / image area), skew is 2·|90° − corner angle|.
  double board_size = 16;
  double board_skew = 17;
  // Max − min over accepted views of x, y, size and skew. Ready needs
  // x, y > 0.5, size > 0.4 and skew > 0.5 (RTAB-Map's thresholds).
  double x_spread = 18;
  double y_spread = 19;
  double size_spread = 20;
  double skew_spread = 21;
  // The CalibrationPlan viewpoint this view filled, or -1.
  int32 matched_viewpoint = 22;
  // Plan viewpoints still to fill.
  repeated uint32 remaining_viewpoints = 23 [packed = true];
}

// The solved stereo calibration from a finished stream.
message EstimatedStereoCalibration {
  StereoCalibration calibration = 1;
  double left_fx = 2;
  double left_fy = 3;
  double right_fx = 4;
  double right_fy = 5;
  double baseline_m = 6;
  // Reprojection RMS (px) per eye and for the stereo solve.
  double rms_left = 7;
  double rms_right = 8;
  double rms_stereo = 9;
  uint32 views_used = 10;
  // In lens_model's order (see CalibrationLensModel).
  repeated double distortion_left = 11 [packed = true];
  repeated double distortion_right = 12 [packed = true];
  // Left camera to right camera (x_right = R·x_left + T), as
  // cv::stereoCalibrate returns it: row-major 3x3, then metres.
  repeated double rotation = 13 [packed = true];
  repeated double translation_m = 14 [packed = true];
  CalibrationLensModel lens_model = 15;
  // translation_m / solved translation: 1 unless expected_baseline_m
  // rescaled it; square_size_m · baseline_scale is the square size
  // the solve implied.
  double baseline_scale = 16;
  double implied_square_size_m = 17;
  double solved_baseline_m = 18;
}

// One server message on the calibration stream.
message CalibrationResponse {
  oneof kind {
    CalibrationFeedback feedback = 1;
    EstimatedStereoCalibration result = 2;
    // Answer to a finish that came before the views were diverse
    // enough: current progress and what is missing. The stream stays open.
    CalibrationFeedback not_ready = 3;
    // First response: sent once the image size is known (right after
    // the config, or with the first frame when the config leaves it 0).
    CalibrationPlan plan = 4;
  }
}

// Camera calibration: stereo frames in, feedback and a next-pose
// suggestion out per view, and the solved calibration on finish.
// Detection and solving run in an OpenCV sidecar; this service owns
// the session (coverage, diversity, guidance) only.
service CameraCalibrationService {
  rpc StreamCalibration(stream CalibrationRequest)
      returns (stream CalibrationResponse);
}

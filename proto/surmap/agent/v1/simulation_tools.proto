syntax = "proto3";

package surmap.agent.v1;

import "surmap/agent/v1/execution.proto";

/*
The survey agent's simulation tools: find licence-compatible 3D assets, keep them in the
station's library, and compose disaster scenarios the Bevy simulation loads at runtime. Every
rpc here is a model-facing tool: its snake_case name is the tool name, its leading comment the
tool description, and its request message the tool's argument schema.

Positions are ENU metres (east, north, up) on the simulated block, at an object's base. These
tools build a simulated world only; nothing here commands a vehicle (docs/architecture.md §1).
*/

service SimulationTools {
  // Searches Poly Haven, ambientCG and Sketchfab for 3D models, textures or HDRI skies. Every
  // hit says whether its licence is accepted (CC0 or CC BY) and, if not, why; only accepted
  // hits can be downloaded. Use the hit's ref with download_asset.
  rpc SearchAssets(SearchAssetsRequest) returns (SearchAssetsResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 20 on_timeout: FAIL};
  }

  // Downloads an accepted search hit into the station's asset library and returns it with
  // the entry path scenarios reference. Refuses a licence that is not CC0 or CC BY.
  rpc DownloadAsset(DownloadAssetRequest) returns (AssetResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 60 on_timeout: DETACH};
  }

  // Lists the assets already in the station's library.
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Creates a scenario from a preset ("earthquake-block": the collapsed city block;
  // "empty-lot": camera, sky and bare ground; "wildfire-edge": pine stands and grass with a
  // fire at their upwind edge; "flood-street": the block in rain and fog) and returns it at
  // version 1.
  rpc CreateScenario(CreateScenarioRequest) returns (ScenarioResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Places a library model in a scenario at an ENU position, with a yaw, scale and
  // collider; give ground_truth_kind (e.g. "car") to score it as a ground-truth object.
  rpc AddModel(AddModelRequest) returns (ScenarioResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Adds one built element to a scenario: a box (ground, road, water, pad), an intact
  // building with windows, a collapsed building, a person, or a stand of vegetation that
  // sways in the wind.
  rpc AddElement(AddElementRequest) returns (ScenarioResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Removes an element or a placed model from a scenario by its id.
  rpc RemoveElement(RemoveElementRequest) returns (ScenarioResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Sets a scenario's weather: rain (mm/h), fog visibility and the one wind every tree, fire
  // and smoke plume follows (where it blows from, clockwise from north; speed and gusts).
  rpc SetWeather(SetWeatherRequest) returns (ScenarioResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Adds a wildfire: ignition point, start time, spread rate and maximum radius. The front
  // spreads downwind with the scenario's wind; flames, embers and smoke follow it.
  rpc AddFire(AddFireRequest) returns (ScenarioResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Removes a fire from a scenario by its id.
  rpc RemoveFire(RemoveFireRequest) returns (ScenarioResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Sets the behaviour tree of a person (by element id) or of the wind (target "wind"), as
  // JSON: nodes sequence, selector, parallel, repeat, invert; conditions time_after, near_fire,
  // near_object, wind_above; actions idle, move_to, follow_path, wander, flee_from_fire, and
  // set_wind for the wind only. Every node is {"node": <kind>, "id": <optional>, ...fields}.
  rpc SetBehaviour(SetBehaviourRequest) returns (ScenarioResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Replaces one node, found by its id, in a target's behaviour tree.
  rpc UpdateBehaviourNode(UpdateBehaviourNodeRequest) returns (ScenarioResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Returns a target's behaviour tree as JSON (empty when it has none).
  rpc GetBehaviour(GetBehaviourRequest) returns (BehaviourResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Lists the building presets: facades and roofs named after Overture's facade_material and
  // roof_material values (brick, glass, roof_tiles, slate, ...), any added preset files, and the
  // districts (old-town, downtown, industrial, suburban, ...).
  rpc ListBuildingPresets(ListBuildingPresetsRequest) returns (BuildingPresetsResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Sets a district: a district preset over an ENU rectangle. Buildings whose centre is inside it
  // draw facade, roof, roof shape and colours from the preset's weighted mix (seeded); later
  // districts win overlaps. Replaces a district with the same id.
  rpc SetDistrict(SetDistrictRequest) returns (ScenarioResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Removes a district by its id.
  rpc RemoveDistrict(RemoveDistrictRequest) returns (ScenarioResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Styles one building, overriding its district: facade and roof presets, roof shape (flat,
  // gabled, hipped, pyramidal), colours, floors and glazing (none, punched, curtain_wall). An
  // unset field keeps what the building has.
  rpc StyleBuilding(StyleBuildingRequest) returns (ScenarioResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Lights a fire inside a building on one floor at a start time. It climbs floor by floor,
  // burns floors out, and spreads to neighbours, farther downwind.
  rpc AddBuildingFire(AddBuildingFireRequest) returns (ScenarioResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Removes a building fire by its id.
  rpc RemoveBuildingFire(RemoveBuildingFireRequest) returns (ScenarioResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Returns a scenario's latest version: its manifest, credits, and the URL the simulation
  // page opens it at.
  rpc GetScenario(GetScenarioRequest) returns (ScenarioResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }

  // Lists the station's scenarios with their latest version.
  rpc ListScenarios(ListScenariosRequest) returns (ListScenariosResponse) {
    option (default_execution) = {mode: SYNC timeout_s: 10 on_timeout: FAIL};
  }
}

enum AssetKind {
  ASSET_KIND_UNSPECIFIED = 0;
  // A glTF/GLB model.
  ASSET_KIND_MODEL = 1;
  // A PBR material's texture maps.
  ASSET_KIND_TEXTURE = 2;
  // An equirectangular HDR sky.
  ASSET_KIND_HDRI = 3;
}

enum Collider {
  COLLIDER_UNSPECIFIED = 0;
  // No physics collider.
  COLLIDER_NONE = 1;
  // A box around the model's bounds.
  COLLIDER_BOX = 2;
  // The model's own triangles.
  COLLIDER_TRIMESH = 3;
}

// A point in ENU metres on the simulated block.
message EnuPoint {
  double east = 1;
  double north = 2;
  double up = 3;
}

message SearchAssetsRequest {
  // What to look for, e.g. "burnt car" or "rubble".
  string query = 1;
  AssetKind kind = 2;
  // Sources to ask ("polyhaven", "ambientcg", "sketchfab"); all of them when empty.
  repeated string sources = 3;
  // Hits per source; 5 when absent.
  optional int32 limit = 4;
}

message AssetHitInfo {
  // "<source>:<asset id>" — what download_asset takes.
  string ref = 1;
  string source = 2;
  AssetKind kind = 3;
  string title = 4;
  string author = 5;
  // The source's own licence label.
  string licence = 6;
  // Whether the licence lets the asset into a scenario.
  bool accepted = 7;
  // Why a refused licence is refused; empty when accepted.
  string licence_reason = 8;
  string page_url = 9;
  string preview_url = 10;
}

message SearchAssetsResponse {
  repeated AssetHitInfo hits = 1;
}

message DownloadAssetRequest {
  // A ref from search_assets, e.g. "polyhaven:covered_car".
  string ref = 1;
}

message StoredAssetInfo {
  string ref = 1;
  AssetKind kind = 2;
  string title = 3;
  string author = 4;
  string licence = 5;
  // The path scenarios use, e.g. "library/polyhaven/covered_car/covered_car_2k.gltf".
  string entry_path = 6;
  // Every file of the asset, relative to the simulation's assets.
  repeated string files = 7;
}

message AssetResponse {
  StoredAssetInfo asset = 1;
}

message ListAssetsRequest {}

message ListAssetsResponse {
  repeated StoredAssetInfo assets = 1;
}

message CreateScenarioRequest {
  // A human name; the scenario id is derived from it.
  string name = 1;
  // "earthquake-block", "empty-lot", "wildfire-edge" or "flood-street".
  string preset = 2;
}

message AddModelRequest {
  string scenario_id = 1;
  // A library asset's ref (download it first).
  string asset_ref = 2;
  // Where the model's base sits.
  EnuPoint position = 3;
  // Counter-clockwise from east, degrees; 0 when absent.
  optional double yaw_deg = 4;
  // Uniform scale; 1 when absent.
  optional double scale = 5;
  Collider collider = 6;
  // Score this instance as a ground-truth object of this kind (e.g. "car").
  optional string ground_truth_kind = 7;
  // The id other tools use; derived from the asset when absent.
  optional string element_id = 8;
}

message BoxElement {
  string id = 1;
  // A material the scenario declares, e.g. "asphalt", "ground", "water".
  string material = 2;
  // Size in metres: east, north, up.
  EnuPoint size = 3;
  EnuPoint position = 4;
  optional double yaw_deg = 5;
  bool collider = 6;
  optional string ground_truth_kind = 7;
}

message BuildingElement {
  string id = 1;
  // The legacy single wall material. Leave empty inside a district (or style the building with
  // StyleBuilding): the district's preset then draws the facade and roof.
  string material = 2;
  EnuPoint size = 3;
  EnuPoint position = 4;
  optional double yaw_deg = 5;
  // Draw a window grid on every face.
  bool windows = 6;
}

message CollapsedBuildingElement {
  string id = 1;
  string material = 2;
  double footprint_east_m = 3;
  double footprint_north_m = 4;
  EnuPoint position = 5;
  optional double yaw_deg = 6;
  // Lays out the slabs and rubble; the same seed gives the same ruin.
  int64 seed = 7;
}

message PersonElement {
  string id = 1;
  EnuPoint position = 2;
  // A coat material the scenario declares, e.g. "coat_orange".
  string coat = 3;
  // A skin material the scenario declares; the scenario's default skin when empty.
  string skin = 4;
}

message VegetationElement {
  string id = 1;
  // A species file, e.g. "species/pine.species.json" or "species/dry_grass.species.json".
  string species = 2;
  // The stand's south-west corner is position − size/2: it is centred here.
  EnuPoint position = 3;
  double size_east_m = 4;
  double size_north_m = 5;
  // Plants per 100 m² (pines: 1–5, grass: 20–50).
  double density_per_100m2 = 6;
  // Lays out the stand; the same seed gives the same stand.
  int64 seed = 7;
}

message AddElementRequest {
  string scenario_id = 1;
  oneof element {
    BoxElement box = 2;
    BuildingElement building = 3;
    CollapsedBuildingElement collapsed_building = 4;
    PersonElement person = 5;
    VegetationElement vegetation = 6;
  }
}

message RemoveElementRequest {
  string scenario_id = 1;
  string element_id = 2;
}

message SetWeatherRequest {
  string scenario_id = 1;
  // Rain in mm/h; 0 for dry.
  double rain_mm_h = 2;
  // Visibility through fog, metres; the scenario's environment value when absent.
  optional double fog_visibility_m = 3;
  // Where the wind blows from, degrees clockwise from north (270 = a westerly).
  double wind_from_deg = 4;
  double wind_speed_m_s = 5;
  // Gust amplitude on top of the speed, m/s.
  double wind_gust_m_s = 6;
}

message AddFireRequest {
  string scenario_id = 1;
  // The id other tools use.
  string id = 2;
  EnuPoint ignition = 3;
  // Seconds into the simulation when it ignites.
  double start_s = 4;
  // Spread rate in still air, m/s (grass fires: 0.05–0.3).
  double spread_m_s = 5;
  // The front never grows past this distance from the ignition, metres.
  double max_radius_m = 6;
  // Draw a smoke plume; true when absent.
  optional bool smoke = 7;
}

message RemoveFireRequest {
  string scenario_id = 1;
  string fire_id = 2;
}

message SetBehaviourRequest {
  string scenario_id = 1;
  // A person element's id, or "wind".
  string target_id = 2;
  // The whole tree, as a JSON object.
  string tree_json = 3;
}

message UpdateBehaviourNodeRequest {
  string scenario_id = 1;
  string target_id = 2;
  string node_id = 3;
  // The replacement node (and its subtree), as a JSON object.
  string node_json = 4;
}

message GetBehaviourRequest {
  string scenario_id = 1;
  string target_id = 2;
}

message BehaviourResponse {
  string target_id = 1;
  // The tree as a JSON object; empty when the target has none.
  string tree_json = 2;
  // The scenario version the tree was read from.
  int32 version = 3;
}

message ListBuildingPresetsRequest {}

message BuildingPresetsResponse {
  repeated string facades = 1;
  repeated string roofs = 2;
  repeated string districts = 3;
}

message Rgb {
  double r = 1;
  double g = 2;
  double b = 3;
}

message SetDistrictRequest {
  string scenario_id = 1;
  string id = 2;
  // A district name (e.g. "downtown") or a building/districts/*.district.json path.
  string preset = 3;
  EnuPoint centre = 4;
  double size_east_m = 5;
  double size_north_m = 6;
  int64 seed = 7;
}

message RemoveDistrictRequest {
  string scenario_id = 1;
  string district_id = 2;
}

message StyleBuildingRequest {
  string scenario_id = 1;
  string building_id = 2;
  // An Overture facade_material name or a building/facades/*.facade.json path.
  optional string facade = 3;
  // An Overture roof_material name or a building/roofs/*.roof.json path.
  optional string roof = 4;
  optional string roof_shape = 5;
  optional Rgb facade_colour = 6;
  optional Rgb roof_colour = 7;
  optional int32 floors = 8;
  optional string glazing = 9;
  optional double window_ratio = 10;
}

message AddBuildingFireRequest {
  string scenario_id = 1;
  string id = 2;
  string building_id = 3;
  int32 floor = 4;
  double start_s = 5;
}

message RemoveBuildingFireRequest {
  string scenario_id = 1;
  string fire_id = 2;
}

message GetScenarioRequest {
  string scenario_id = 1;
}

message ScenarioInfo {
  string id = 1;
  string name = 2;
  int32 version = 3;
  // The scenario's manifest (the simulation's scene.json), as JSON.
  string manifest_json = 4;
  // "<title> by <author> (<licence>), <page>" for every CC BY asset it uses.
  repeated string credits = 5;
  // Where the simulation page opens it, on the station.
  string url = 6;
  string updated_at = 7;
}

message ScenarioResponse {
  ScenarioInfo scenario = 1;
}

message ListScenariosRequest {}

message ListScenariosResponse {
  // Latest versions, without their manifests.
  repeated ScenarioInfo scenarios = 1;
}

name: Bevy WASM PoC build

# Compiles examples/bevy-sitl-poc to a WASM bundle with trunk.
# Separate from the native tests so the two run concurrently;
# path-filtered to the PoC. The commands are the ones the PoC README
# documents for local runs.

on:
  push:
    branches: [main]
    paths:
      - "examples/bevy-sitl-poc/**"
      - ".github/workflows/bevy-wasm-build.yml"
  pull_request:
    paths:
      - "examples/bevy-sitl-poc/**"
      - ".github/workflows/bevy-wasm-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bevy-wasm-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trunk-build:
    name: trunk build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/bevy-sitl-poc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # shared-key: the test workflow (workflow_run, after this one)
      # restores this same cache so it only compiles the test code.
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/bevy-sitl-poc
          shared-key: bevy-sitl-poc

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build WASM bundle
        run: trunk build index.html --release

      - name: Check bundle was produced
        run: |
          ls -lh dist/
          test -n "$(find dist -name '*_bg.wasm' -size +1M -print -quit)"

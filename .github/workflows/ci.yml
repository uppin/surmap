name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Type check (mypy strict)
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

  rtabmap-e2e:
    # Real RTAB-Map: tooling pulls the pinned sidecar image and the
    # EuRoC subset from this repo's fixtures-euroc-v1 release asset
    # (the upstream hosts rate-limit CI range requests, HTTP 429);
    # no RTAB-Map is installed on the runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --group dev --python 3.12

      - name: Fetch RTAB-Map sidecar image and EuRoC fixture
        run: uv run python scripts/fetch_rtabmap_fixture.py

      - name: Real RTAB-Map CM5 e2e
        env:
          SURMAP_REQUIRE_RTABMAP_E2E: "1"
        run: uv run pytest tests/test_survey_cm5_rtabmap_e2e.py -q

  rtabmap-stream-e2e:
    # Real streaming backend: derived image built from repo sources,
    # EuRoC subset from the fixtures release asset.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --group dev --python 3.12

      - name: Fetch EuRoC fixture
        run: uv run python scripts/fetch_rtabmap_fixture.py --skip-docker

      - name: Build streaming image
        run: uv run python scripts/build_rtabmap_stream.py

      - name: Real RTAB-Map streaming e2e
        env:
          SURMAP_REQUIRE_RTABMAP_STREAM_E2E: "1"
        run: uv run pytest tests/test_slam_streaming_e2e.py -q

  coral-e2e:
    # Real detector network (CPU twin of the Edge-TPU artifact; no
    # Coral board in CI) plus the EuRoC frames from the RTAB fixture
    # release asset (see rtabmap-e2e above).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --group dev --python 3.12

      - name: Fetch Coral model artifacts
        run: uv run python scripts/fetch_coral_model.py

      - name: Fetch EuRoC frames (no Docker image needed here)
        run: uv run python scripts/fetch_rtabmap_fixture.py --skip-docker

      - name: Real Coral detections CM5 e2e
        env:
          SURMAP_REQUIRE_CORAL_E2E: "1"
        run: uv run pytest tests/test_survey_cm5_coral_e2e.py -q
